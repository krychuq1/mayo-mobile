<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>mayo — przyciski, inputy, karty</title>
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    .demo { padding: 24px; display: flex; flex-direction: column; gap: 16px; max-width: 420px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <div class="demo">
    <div class="row">
      <button class="btn">dodaj przedmiot</button>
      <button class="btn btn--secondary">anuluj</button>
      <button class="btn btn--danger">usuń</button>
      <button class="btn btn--small">odśwież</button>
      <button class="btn" disabled>pobieram…</button>
    </div>

    <input class="mayo-input" placeholder="np. sweterek z misiem" />

    <div class="card">
      <h2>nowy przedmiot</h2>
      <p class="muted" style="margin: 4px 0 12px">przedmioty z vinted, które pokażą się w mayo-app</p>
      <input class="mayo-input" placeholder="wklej link z vinted..." />
      <p class="error-text" style="margin: 8px 0 0">Podaj poprawny adres email.</p>
    </div>
  </div>
</body>
</html>
